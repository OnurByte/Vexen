name: ci

on:
  pull_request:
  push:
    branches: [implementation]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure git identity for fixtures
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      - name: Test
        shell: bash
        run: |
          # The cochange benchmark is a harness=false binary that needs
          # arguments, so run lib, bins and integration tests only.
          # Some fixtures need file names the OS refuses to create:
          # control characters on Windows, non-UTF-8 bytes on macOS (APFS).
          # Known gaps, skipped per platform rather than hidden.
          case "${{ matrix.os }}" in
            windows-latest) skip="control_separator_in_path" ;;
            macos-latest)   skip="non_utf8" ;;
            *)              skip="" ;;
          esac
          if [ -n "$skip" ]; then
            cargo test --lib --bins --tests -- --skip "$skip"
          else
            cargo test --lib --bins --tests
          fi

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wrapper syntax and metadata
        working-directory: npm
        run: |
          node --check bin/vexen.js
          node --test tests/release-version.test.cjs
          node -e "const p=require('./package.json'); if(!p.bin.vexen||p.name!=='@onurbyte/vexen') process.exit(1)"
          npm pack --dry-run

  launcher-smoke:
    # Runs the npm launcher against the latest published release, so the
    # download, checksum, unpack and run path is exercised on every OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Launcher downloads, verifies and runs the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          ver="${tag#v}"
          work="$RUNNER_TEMP/vexen-launcher-smoke"
          rm -rf "$work"; mkdir -p "$work/bin" "$work/repo"
          cp npm/bin/vexen.js "$work/bin/vexen.js"
          printf '{"version":"%s"}' "$ver" > "$work/package.json"
          export VEXEN_HOME="$work/cache"
          got=$(node "$work/bin/vexen.js" --version)
          echo "$got"
          [ "$got" = "vexen $ver" ]
          git -C "$work/repo" init -q
          echo 'fn main() {}' > "$work/repo/main.rs"
          git -C "$work/repo" add main.rs
          git -C "$work/repo" commit -qm init
          node "$work/bin/vexen.js" init --repo "$work/repo"
          node "$work/bin/vexen.js" doctor --repo "$work/repo" | tee "$work/doctor.txt"
          grep -q "integrity: ok" "$work/doctor.txt"

  docs-links:
    # Relative links and heading anchors in every tracked Markdown file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-docs-links.py
