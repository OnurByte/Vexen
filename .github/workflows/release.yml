name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, Cargo.toml and npm/package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          npm_v=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' npm/package.json | head -n1)
          echo "tag=$tag cargo=$cargo_v npm=$npm_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$npm_v" ]

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, ext: zip, exe: vexen.exe }
          - { os: ubuntu-latest, triple: x86_64-unknown-linux-gnu, ext: tar.gz, exe: vexen }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, ext: tar.gz, exe: vexen }
          - { os: macos-13, triple: x86_64-apple-darwin, ext: tar.gz, exe: vexen }
          - { os: macos-latest, triple: aarch64-apple-darwin, ext: tar.gz, exe: vexen }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="vexen-${version}-${{ matrix.triple }}"
          mkdir dist
          cp "target/release/${{ matrix.exe }}" "dist/${{ matrix.exe }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/${{ matrix.exe }} -DestinationPath ${name}.zip"
          else
            tar -czf "${name}.tar.gz" -C dist "${{ matrix.exe }}"
          fi
          sha256sum "${name}.${{ matrix.ext }}" | sed 's/ \*/  /' > "${name}.${{ matrix.ext }}.sha256"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="vexen-${version}-${{ matrix.triple }}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Early development release. See README for status."
          gh release upload "$GITHUB_REF_NAME" "${name}.${{ matrix.ext }}" "${name}.${{ matrix.ext }}.sha256" --clobber

  publish-npm:
    needs: build
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
