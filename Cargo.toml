[package]
name = "vexen"
version = "0.2.5"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
rmcp = { version = "=3.8.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
clap = { version = "4", features = ["derive"] }
toml_edit = "0.22"

[dev-dependencies]
rmcp = { version = "=3.8.0", features = ["client", "transport-async-rw"] }
tempfile = "3"
# Generated lifecycle tests only (tests/lifecycle.rs); never part of the runtime. MIT OR Apache-2.0.
proptest = "1.12"
tokio = { version = "1", features = ["io-util"] }

[lib]
name = "vexen"
path = "src/lib.rs"

[[bench]]
name = "cochange"
harness = false
path = "benchmarks/cochange/main.rs"

