[package]
name = "vexen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lib]
name = "vexen"
path = "src/lib.rs"

[[bench]]
name = "cochange"
harness = false
path = "benchmarks/cochange/main.rs"

