[package]
name = "vexen-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A calm desktop viewer for Vexen's evidence-backed repository memory, built with GPUI Kit."
publish = false

[dependencies]
gpui-kit = "0.9.0"
vexen = { path = ".." }

# A separate workspace: the desktop app never changes the CLI crate, its tests or its npm package.
[workspace]

# Optimizes GPUI and the component library while the app's own code stays in Debug (see gpui-kit.com/docs/installation).
[profile.dev.package."*"]
opt-level = 3
